<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudFront S3 Terraform Project</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="card">
            <h1>AWS CloudFront + S3</h1>

            <p class="subtitle">
                Static Website Deployment using Terraform
            </p>

            <div class="status">
                <span class="dot"></span>
                Website is running successfully
            </div>

            <div class="info">
                <p><strong>Storage:</strong> Amazon S3</p>
                <p><strong>CDN:</strong> Amazon CloudFront</p>
                <p><strong>Security:</strong> Origin Access Control</p>
                <p><strong>Infrastructure:</strong> Terraform</p>
                <p><strong>Protocol:</strong> HTTPS</p>
            </div>

            <button onclick="showMessage()">
                Test JavaScript
            </button>

            <p id="message"></p>
        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
